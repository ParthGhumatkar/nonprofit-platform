
services:
  db:
    image: postgres:16-alpine
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
        -c synchronous_commit=off
        -c checkpoint_completion_target=0.9
        -c max_wal_size=2GB
        -c max_connections=200
    environment:
      POSTGRES_DB: nonprofit_platform
      POSTGRES_USER: nonprofit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonprofit -d nonprofit_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://nonprofit:${DB_PASSWORD:-devpassword}@db:5432/nonprofit_platform
      RAW_XML_DIR: /data/raw_xml
      BMF_DIR: /data/bmf
    volumes:
      - ./data/raw_xml:/data/raw_xml
      - ./data/bmf:/data/bmf
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      DATABASE_URL: postgresql://nonprofit:${DB_PASSWORD:-devpassword}@db:5432/nonprofit_platform
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
